<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollopsy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
    </div>
    <div class="title-container">
      <h1>Scrollopsy</h1>
      <span class="version-badge">Stage 4 &bull; Time Tracking</span>
    </div>
  </header>

  <main class="status-card">
    <div class="status-row">
      <span>Extension Status</span>
      <div class="status-indicator">
        <span class="dot"></span> Active
      </div>
    </div>
    <p class="info-text">
      Observing YouTube Shorts and recording session data into local storage.
    </p>
  </main>

  <section class="debug-card">
    <div class="debug-header">
      <h2>Session Inspector (Debug)</h2>
      <button id="refresh-btn" class="btn-sm" title="Refresh stored session">🔄 Refresh</button>
    </div>

    <div class="debug-meta">
      <div class="meta-item">
        <span class="meta-label">Session ID:</span>
        <span id="session-id-val" class="meta-val">None (not started)</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Shorts Stored:</span>
        <span id="session-count-val" class="meta-val highlight">0</span>
      </div>
    </div>

    <div class="debug-actions">
      <button id="toggle-json-btn" class="btn-action">View Session JSON</button>
      <button id="clear-session-btn" class="btn-action danger">Clear Storage</button>
    </div>

    <pre id="json-viewer" class="json-viewer hidden"></pre>
  </section>

  <footer>
    Scrollopsy &bull; Local Storage Session Engine
  </footer>

  <script src="popup.js"></script>
</body>
</html>
